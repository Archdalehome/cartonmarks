<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Carton Mark M2 · 浏览器内自检</title>
<style>
  body { font: 13px/1.6 system-ui, "Microsoft YaHei", sans-serif; margin: 0; padding: 16px 20px; color: #0f172a; }
  h1 { font-size: 15px; margin: 0 0 4px; }
  h2 { font-size: 13px; margin: 14px 0 6px; color: #334155; }
  ol { padding-left: 22px; margin: 0 0 10px; font-family: ui-monospace, Consolas, monospace; font-size: 12.5px; }
  .pass::after { content: " ✓"; color: #15803d; }
  .fail::after { content: " ✗"; color: #c0392b; font-weight: 700; }
  .fail { color: #c0392b; }
  #summary { font-weight: 700; margin: 10px 0; }
  iframe { border: 1px solid #cbd5e1; border-radius: 8px; margin-top: 10px; width: 1180px; height: 860px; }
</style>
</head>
<body>
<h1>Carton Mark M2 · 浏览器内自检（同源 iframe 真点击 / 真拖动 / 真缩放）</h1>
<ol id="out"></ol>
<div id="summary">运行中…</div>
<iframe id="frame"></iframe>
<iframe id="mob" style="width: 380px; height: 620px;"></iframe>

<script type="module">
const out = document.getElementById('out');
const summary = document.getElementById('summary');
const frame = document.getElementById('frame');
const mob = document.getElementById('mob');

let pass = 0;
let fail = 0;

function fatal(msg) {
  summary.textContent = `脚本错误：${msg}`;
  summary.className = 'fail';
  document.title = 'UAT ERROR';
}
window.addEventListener('error', (e) => fatal(e.message || String(e.error)));
window.addEventListener('unhandledrejection', (e) => fatal(String((e.reason && e.reason.message) || e.reason)));

function check(name, ok, detail = '') {
  const li = document.createElement('li');
  li.className = ok ? 'pass' : 'fail';
  li.textContent = ok ? name : `${name}${detail ? ' — ' + detail : ''}`;
  out.appendChild(li);
  ok ? pass++ : fail++;
  if (document.title !== 'UAT ERROR') {
    summary.textContent = `进行中：${pass} 通过 / ${fail} 失败`;
  }
  return ok;
}
const tick = (ms) => new Promise((r) => setTimeout(r, ms));

const docOf = () => frame.contentDocument;
const winOf = () => frame.contentWindow;
const $ = (s) => docOf().querySelector(s);
const $$ = (s) => Array.from(docOf().querySelectorAll(s));
const cm = () => winOf().__CM__;
const click = (node) => node.dispatchEvent(new (winOf().MouseEvent)('click', { bubbles: true }));
const fire = (node, type) => node.dispatchEvent(new (winOf().Event)(type, { bubbles: true }));
const pointer = (node, type, x, y, id = 1) =>
  node.dispatchEvent(new (winOf().PointerEvent)(type, { bubbles: true, clientX: x, clientY: y, button: 0, pointerId: id, isPrimary: true }));

async function loadFrame() {
  await new Promise((resolve) => {
    frame.addEventListener('load', resolve, { once: true });
    frame.src = '/index.html?r=' + Date.now();
  });
  await tick(250);
}

await loadFrame();

/* ── M1：图纸与口径 ─────────────────────────────── */

check('页面脚本无异常，window.__CM__ 可用', Boolean(cm() && cm().state));
check('几何 = 2000 × 700 mm', (() => {
  const n = cm().getNet();
  return n && n.width === 2000 && n.height === 700;
})());
check('展开图 12 个区域', $$('.panel').length === 12, `实际 ${$$('.panel').length}`);
check('8 个可编辑面可点击，防尘摇盖不可点',
  $$('.panel[role="button"]').length === 8 && $$('.panel[data-slot="minor"][role="button"]').length === 0);
check('12 个中文标签齐全',
  ['前箱唛', '右侧箱唛', '后箱唛', '左侧箱唛', '前顶箱唛', '右顶箱唛', '后顶箱唛', '左顶箱唛',
    '前底箱唛', '右底箱唛', '后底箱唛', '左底箱唛'].every((t) => $$('.panel-label').some((n) => n.textContent === t)));

const minorPanel = $('.panel[data-panel="topRight"]');
click(minorPanel);
check('点防尘摇盖不进入编辑态',
  !minorPanel.classList.contains('is-selected') && docOf().getElementById('editorCard').hidden === true);

/* ── M2：8 个可编辑面都能进编辑器 ──────────────── */

const editableKeys = ['front', 'right', 'back', 'left', 'topFront', 'topBack', 'bottomFront', 'bottomBack'];
let allOpen = true;
const failedPanels = [];
for (const key of editableKeys) {
  click($(`.panel[data-panel="${key}"]`));
  await tick(120);
  const card = docOf().getElementById('editorCard');
  const title = docOf().getElementById('editorTitle').textContent;
  const selected = cm().state.selected;
  const ok = !card.hidden && selected === key && title === $(`.panel[data-panel="${key}"] .panel-label`).textContent;
  if (!ok) {
    allOpen = false;
    failedPanels.push(`${key}:${selected}`)
  }
}
check('8 个可编辑面都能点开编辑器且标题正确', allOpen, failedPanels.join(','));

/* ── 新建文字 ──────────────────────────────────── */

click($('.panel[data-panel="front"]'));
await tick(200);
check('前面板编辑器已打开', !docOf().getElementById('editorCard').hidden && cm().state.selected === 'front');

// 点画布空白处应弹新建窗口
const canvasEl = $('.ed-canvas');
const cb = canvasEl.getBoundingClientRect();
canvasEl.dispatchEvent(new (winOf().MouseEvent)('click', { bubbles: true, clientX: cb.left + 4, clientY: cb.top + 4 }));
check('点面板空白处弹出新建元素窗口', docOf().getElementById('elementDialog').open === true);
docOf().getElementById('elementDialog').close();

click(docOf().getElementById('addTextBtn'));
check('「+ 文字」打开新建窗口', docOf().getElementById('elementDialog').open === true);

docOf().getElementById('elementText').value = '小心轻放';
docOf().getElementById('elementFontSize').value = '30';
docOf().getElementById('elementBold').checked = true;
docOf().getElementById('elementAlign').value = 'center';
docOf().getElementById('elementForm').requestSubmit();
await tick(200);

let frontEls = cm().state.panels.front.elements;
check('文字元素已加入', frontEls.length === 1 && frontEls[0].type === 'text');
check('元素坐标/字号存的是毫米', frontEls[0].fontSize === 30
  && frontEls[0].x >= 0 && frontEls[0].x + frontEls[0].w <= 600.001
  && frontEls[0].y >= 0 && frontEls[0].y + frontEls[0].h <= 300.001,
  JSON.stringify({ x: frontEls[0].x, y: frontEls[0].y, w: frontEls[0].w, h: frontEls[0].h }));
check('文字元素已渲染到画布', $('.ed-el') !== null && $('.ed-el .ed-text').textContent === '小心轻放');

/* ── 拖拽 ──────────────────────────────────────── */

const el0 = cm().state.panels.front.elements[0];
const before = { x: el0.x, y: el0.y };
const node = $('.ed-el');
const nb = node.getBoundingClientRect();
const cx = nb.left + nb.width / 2;
const cy = nb.top + nb.height / 2;
pointer(node, 'pointerdown', cx, cy, 1);
const nodeAfterSelect = $('.ed-el');
pointer(nodeAfterSelect, 'pointermove', cx + 40, cy + 26, 1);
pointer(nodeAfterSelect, 'pointerup', cx + 40, cy + 26, 1);
await tick(120);

check('拖拽后元素位置变化', el0.x > before.x + 0.5 || el0.y > before.y + 0.5,
  `from ${before.x.toFixed(1)},${before.y.toFixed(1)} to ${el0.x.toFixed(1)},${el0.y.toFixed(1)}`);
check('拖拽后仍夹在面板内',
  el0.x >= 0 && el0.y >= 0 && el0.x + el0.w <= 600.001 && el0.y + el0.h <= 300.001);

/* ── 四角缩放 ──────────────────────────────────── */

const sizeBefore = { w: el0.w, h: el0.h };
const handle = $('.ed-handle[data-corner="se"]');
const hb = handle.getBoundingClientRect();
pointer(handle, 'pointerdown', hb.left + 4, hb.top + 4, 2);
const nodeResize = $('.ed-el');
pointer(nodeResize, 'pointermove', hb.left + 4 + 60, hb.top + 4 + 40, 2);
pointer(nodeResize, 'pointerup', hb.left + 4 + 60, hb.top + 4 + 40, 2);
await tick(120);

check('拖右下角后宽高变大', el0.w > sizeBefore.w + 0.5 && el0.h > sizeBefore.h + 0.5,
  `${sizeBefore.w.toFixed(1)}×${sizeBefore.h.toFixed(1)} → ${el0.w.toFixed(1)}×${el0.h.toFixed(1)}`);
check('缩放后仍夹在面板内',
  el0.x + el0.w <= 600.001 && el0.y + el0.h <= 300.001);

/* ── 方向键微调 ────────────────────────────────── */

const nudgeBefore = el0.x;
docOf().body.dispatchEvent(new (winOf().KeyboardEvent)('keydown', { key: 'ArrowRight', bubbles: true }));
await tick(80);
check('方向键移动 1mm', Math.abs(el0.x - (nudgeBefore + 1)) < 0.01, `${nudgeBefore} → ${el0.x}`);

/* ── 上传图片（合成 File，真走 FileReader + canvas 压缩） ── */

click(docOf().getElementById('addImageBtn'));
check('「+ 图片」打开上传面板', docOf().getElementById('elementDialog').open === true
  && docOf().getElementById('imagePane').hidden === false);

const cv = docOf().createElement('canvas');
cv.width = 240;
cv.height = 160;
const ctx = cv.getContext('2d');
ctx.fillStyle = '#1f6feb';
ctx.fillRect(0, 0, 240, 160);
ctx.fillStyle = '#fff';
ctx.font = '28px sans-serif';
ctx.fillText('LOGO', 60, 90);
const dataUrl = cv.toDataURL('image/png');
const blob = await (await winOf().fetch(dataUrl)).blob();
const file = new (winOf().File)([blob], 'logo.png', { type: 'image/png' });
const dt = new (winOf().DataTransfer)();
dt.items.add(file);
const fileInput = docOf().getElementById('elementFile');
fileInput.files = dt.files;
fire(fileInput, 'change');
await tick(700);

check('图片经 FileReader + 压缩后有预览',
  docOf().querySelector('#imagePreview img') !== null,
  docOf().getElementById('elementError').textContent);

docOf().getElementById('elementForm').requestSubmit();
await tick(300);

frontEls = cm().state.panels.front.elements;
const imgEl = frontEls.find((e) => e.type === 'image');
check('图片元素已加入且 src 是 dataURL', Boolean(imgEl && imgEl.src.startsWith('data:image/')));
check('图片默认尺寸在面板内', imgEl && imgEl.w <= 600 && imgEl.h <= 300);

/* ── 复制到另一面（深拷贝） ────────────────────── */

docOf().getElementById('copyTarget').value = 'back';
click(docOf().getElementById('copyOverwriteBtn'));
await tick(200);

const backEls = cm().state.panels.back.elements;
check('覆盖复制后目标面元素数量一致', backEls.length === frontEls.length, `${backEls.length} vs ${frontEls.length}`);
check('复制是深拷贝：id 不同、内容一致',
  backEls.every((b, i) => b.id !== frontEls[i].id && b.type === frontEls[i].type && b.text === frontEls[i].text));

/* ── 改副本不影响原件 ──────────────────────────── */

click($('.panel[data-panel="back"]'));
await tick(200);
const items = $$('.prop-item');
click(items[0]);
await tick(120);
const ta = docOf().getElementById('propText');
if (ta) {
  ta.value = '改过的副本';
  fire(ta, 'input');
}
await tick(150);

const frontText = cm().state.panels.front.elements.find((e) => e.type === 'text');
const backText = cm().state.panels.back.elements.find((e) => e.type === 'text');
check('改副本后，原件文字不变', frontText.text === '小心轻放', frontText.text);
check('副本文字已改', backText.text === '改过的副本', backText.text);

/* ── 撤销 / 重做 ───────────────────────────────── */

click(docOf().getElementById('undoBtn'));
await tick(150);
check('撤销后副本文字回到修改前',
  cm().state.panels.back.elements.find((e) => e.type === 'text').text === '小心轻放');
click(docOf().getElementById('redoBtn'));
await tick(150);
check('重做后副本文字恢复',
  cm().state.panels.back.elements.find((e) => e.type === 'text').text === '改过的副本');

/* ── 刷新后草稿还在 ────────────────────────────── */

await tick(900); // 等草稿 debounce 落盘
await loadFrame(); // 重新加载页面

const frontAfter = cm().state.panels.front.elements;
const backAfter = cm().state.panels.back.elements;
check('刷新后前面板内容还在', frontAfter.length === 2, `实际 ${frontAfter.length}`);
check('刷新后后面板内容还在', backAfter.length === 2, `实际 ${backAfter.length}`);
check('刷新后文字内容一致',
  frontAfter.find((e) => e.type === 'text').text === '小心轻放'
  && backAfter.find((e) => e.type === 'text').text === '改过的副本');
check('刷新后图片 dataURL 还在', frontAfter.some((e) => e.type === 'image' && e.src.startsWith('data:image/')));

/* ── M4：首屏性能与页面文案 ─────────────────────── */

const fontBefore = winOf().performance.getEntriesByType('resource').some((e) => /carton-sans\.ttf/.test(e.name));
check('首屏不加载 2.1MB 中文字体（导出时才懒加载）', !fontBefore);

const printNote = docOf().getElementById('printNote');
check('页面里写明了打印要选「实际大小 / 100%」',
  Boolean(printNote) && printNote.textContent.includes('实际大小') && printNote.textContent.includes('100%'),
  printNote ? printNote.textContent.slice(0, 40) : '缺 printNote');

const robots = await (await winOf().fetch('/robots.txt')).text();
check('robots.txt 可访问且允许抓取', robots.includes('User-agent: *') && robots.includes('Allow: /'));

const resp404 = await winOf().fetch('/404.html');
const html404 = await resp404.text();
check('404 页面存在且指向首页', resp404.ok && html404.includes('这个页面不存在') && html404.includes('href="/"'));

/* ── 撤销栈深度 ≥ 20 ───────────────────────────── */

check('撤销历史容量至少 20 步', cm().history && cm().history.limit >= 20, String(cm().history && cm().history.limit));

/* ── M3：PDF 导出 ──────────────────────────────── */

check('jsPDF / opentype 本地依赖已加载',
  Boolean(winOf().jspdf && winOf().jspdf.jsPDF && winOf().opentype));

let pdf = null;
let pdfError = '';
try {
  pdf = await cm().exportPdf({ compress: false });
} catch (err) {
  pdfError = err.message || String(err);
}

check('生成 PDF（Blob 有内容）', Boolean(pdf) && pdf.blob.size > 5000,
  pdfError || (pdf ? `${pdf.blob.size} bytes` : '无结果'));

if (pdf) {
  check('整张模式 = 1 页', pdf.pageCount === 1, String(pdf.pageCount));
  check('页面尺寸 = 2000 × 700 mm（1:1）',
    Math.abs(pdf.pageSize.width - 2000) < 0.5 && Math.abs(pdf.pageSize.height - 700) < 0.5,
    JSON.stringify(pdf.pageSize));

  const pdfText = await pdf.blob.text();
  const mediaBox = (pdfText.match(/\/MediaBox\s*\[[^\]]*\]/) || [''])[0];
  check('PDF MediaBox 与 2000×700 mm 换算一致（约 5669 × 1984 pt）',
    /5669\.\d+\s+1984\.\d+/.test(mediaBox), mediaBox);

  check('PDF 元信息写入尺寸（ASCII，不乱码）',
    /Carton Mark artwork 600x400x300 mm/.test(pdfText)
    && /Unfolded net 2000x700 mm at 1:1/.test(pdfText));

  check('中文按矢量路径输出（没有文字对象 BT/Tj）',
    !/\bBT\b/.test(pdfText) && !/\bTj\b/.test(pdfText),
    `BT=${/\bBT\b/.test(pdfText)} Tj=${/\bTj\b/.test(pdfText)}`);

  const curveCount = (pdfText.match(/\sc\s/g) || []).length;
  check('PDF 里有大量贝塞尔路径（字形轮廓）', curveCount > 50, `曲线段 ${curveCount}`);

  check('PDF 里嵌入了图片（XObject）', /\/XObject/.test(pdfText));

  const pdfPanel = await cm().exportPdf({ mode: 'panel', compress: false });
  check('每面一页模式 = 2 页（前后两面有内容）', pdfPanel.pageCount === 2, String(pdfPanel.pageCount));

  const tilePdf = await cm().exportPdf({ mode: 'tile', tilePaper: 'a3', compress: false });
  check('A3 拼版 = 15 块（5 列 × 3 行）', tilePdf.pageCount === 15, String(tilePdf.pageCount));
  check('拼版纸张 = A3 横放 420 × 297 mm',
    Math.abs(tilePdf.pageSize.width - 420) < 0.5 && Math.abs(tilePdf.pageSize.height - 297) < 0.5,
    JSON.stringify(tilePdf.pageSize));

  const tileText = await tilePdf.blob.text();
  const pageObjects = (tileText.match(/\/Type\s*\/Page(?![s])/g) || []).length;
  check('拼版 PDF 里有 15 个页面对象', pageObjects === 15, String(pageObjects));

  const tilePdfA4 = await cm().exportPdf({ mode: 'tile', tilePaper: 'a4', compress: false });
  check('A4 拼版块数比 A3 多', tilePdfA4.pageCount > tilePdf.pageCount,
    `A4 ${tilePdfA4.pageCount} vs A3 ${tilePdf.pageCount}`);
}

// 空内容导出应该给出明确提示
const savedPanels = cm().state.panels;
const emptyPanels = {};
for (const k of Object.keys(savedPanels)) emptyPanels[k] = { label: savedPanels[k].label, elements: [] };
let emptyMsg = '';
cm().state.panels = emptyPanels;
try {
  await cm().exportPdf({ download: false });
} catch (err) {
  emptyMsg = err.message || String(err);
}
cm().state.panels = savedPanels;
check('没有内容时拒绝导出并提示', /还没有任何箱唛内容/.test(emptyMsg), emptyMsg);

/* ── 导出弹层：拼版选项 ────────────────────────── */

click(docOf().getElementById('exportBtn'));
await tick(400);
docOf().getElementById('exportMode').value = 'tile';
fire(docOf().getElementById('exportMode'), 'change');
await tick(300);
check('导出弹层切到拼版时出现纸张选择', !docOf().getElementById('tilePaperField').hidden);
check('拼版摘要显示块数', docOf().getElementById('exportSummary').textContent.includes('块'));
check('拼版提示强调按 100% 打印',
  docOf().getElementById('exportWarnings').textContent.includes('拼接') ||
  docOf().getElementById('printNote').textContent.includes('100%'));
docOf().getElementById('exportDialog').close();

/* ── M5：英寸与线条 ────────────────────────────── */

click($('.panel[data-panel="front"]'));
await tick(200);
click(docOf().getElementById('addLineBtn'));
await tick(200);
check('线条弹层能打开', docOf().getElementById('elementDialog').open === true
  && docOf().getElementById('linePane').hidden === false);

docOf().getElementById('elementForm').requestSubmit();
await tick(250);

let lineEl = cm().state.panels.front.elements.find((e) => e.type === 'line');
check('横线默认粗细 10 mm、长度 = 面板宽 × 45%（600 → 270）',
  Boolean(lineEl) && Math.abs(lineEl.h - 10) < 1e-6 && Math.abs(lineEl.w - 270) < 0.01,
  lineEl ? `${lineEl.w} × ${lineEl.h}` : '没加上');

const thickInput = docOf().getElementById('propLineThickness');
thickInput.value = '20';
fire(thickInput, 'input');
await tick(200);
lineEl = cm().state.panels.front.elements.find((e) => e.type === 'line');
check('属性面板改粗细 20 mm 生效', Math.abs(lineEl.h - 20) < 0.01, String(lineEl.h));

const orientSelect = docOf().getElementById('propLineOrientation');
orientSelect.value = 'vertical';
fire(orientSelect, 'change');
await tick(200);
lineEl = cm().state.panels.front.elements.find((e) => e.type === 'line');
check('切换竖线后长宽互换（20 粗 × 270 长）',
  lineEl.orientation === 'vertical' && Math.abs(lineEl.w - 20) < 0.01 && Math.abs(lineEl.h - 270) < 0.01,
  `${lineEl.w} × ${lineEl.h}`);

const lineNode = $('.ed-el[data-id="' + lineEl.id + '"]');
const lb = lineNode.getBoundingClientRect();
pointer(lineNode, 'pointerdown', lb.left + lb.width / 2, lb.top + lb.height / 2, 5);
const lineNode2 = $('.ed-el[data-id="' + lineEl.id + '"]');
pointer(lineNode2, 'pointermove', lb.left + lb.width / 2 + 30, lb.top + lb.height / 2 + 20, 5);
pointer(lineNode2, 'pointerup', lb.left + lb.width / 2 + 30, lb.top + lb.height / 2 + 20, 5);
await tick(150);
check('线条能拖动且不出面板',
  lineEl.x >= 0 && lineEl.y >= 0 && lineEl.x + lineEl.w <= 600.001 && lineEl.y + lineEl.h <= 300.001);

const pdfWithLine = await cm().exportPdf({ compress: false });
check('带线条也能正常导出 PDF', pdfWithLine.pageCount >= 1 && pdfWithLine.blob.size > 5000, `${pdfWithLine.blob.size} bytes`);

// 英寸
click(docOf().querySelector('[data-unit="in"]'));
await tick(250);
check('切英寸后显示 23.62 / 15.75 / 11.81',
  docOf().getElementById('dimL').value === '23.62'
  && docOf().getElementById('dimW').value === '15.75'
  && docOf().getElementById('dimH').value === '11.81',
  [docOf().getElementById('dimL').value, docOf().getElementById('dimW').value, docOf().getElementById('dimH').value].join('/'));

const dimLIn = docOf().getElementById('dimL');
dimLIn.value = '24';
fire(dimLIn, 'input');
await tick(250);
check('输入 24 in → 内部 609.6 mm', Math.abs(cm().state.dims.L - 609.6) < 1e-6, String(cm().state.dims.L));
check('英寸下展开图仍按毫米重算（2×609.6 + 2×400 = 2019.2）',
  Math.abs(cm().getNet().width - 2019.2) < 0.01, String(cm().getNet().width));

click(docOf().querySelector('[data-unit="mm"]'));
await tick(200);

/* ── 窄屏 380px ────────────────────────────────── */

await new Promise((resolve) => {
  mob.addEventListener('load', resolve, { once: true });
  mob.src = '/index.html?m=' + Date.now();
});
await tick(400);

const mdoc = mob.contentDocument;
const mwin = mob.contentWindow;
check('窄屏无横向溢出',
  mdoc.documentElement.scrollWidth <= mwin.innerWidth + 1,
  `${mdoc.documentElement.scrollWidth} vs ${mwin.innerWidth}`);

const mFront = mdoc.querySelector('.panel[data-panel="front"]');
mFront.dispatchEvent(new mwin.MouseEvent('click', { bubbles: true }));
await tick(300);
check('窄屏下点面板能打开编辑器且不撑破视口',
  !mdoc.getElementById('editorCard').hidden && mdoc.documentElement.scrollWidth <= mwin.innerWidth + 1,
  `${mdoc.documentElement.scrollWidth} vs ${mwin.innerWidth}`);
check('窄屏下元素照常渲染', mdoc.querySelectorAll('.ed-el').length >= 1);
check('窄屏显示「精确定位请用桌面端」提示',
  mdoc.getElementById('mobileHint') !== null && !mdoc.getElementById('mobileHint').hidden);

summary.textContent = fail === 0 ? `全部通过：${pass} 项` : `失败 ${fail} 项 / 共 ${pass + fail} 项`;
summary.className = fail === 0 ? 'pass' : 'fail';
document.title = fail === 0 ? 'UAT PASS' : 'UAT FAIL';
</script>
</body>
</html>
